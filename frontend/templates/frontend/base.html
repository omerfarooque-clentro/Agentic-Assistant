{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Personal Ops{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        const saved = localStorage.getItem('ops_theme');
        const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') document.documentElement.classList.add('theme-dark');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{% static 'frontend/app.css' %}?v=20260920_cards_v4">
  <link rel="stylesheet" href="{% static 'frontend/result_cards.css' %}?v=20260920_cards_v4">
</head>

<body>
  <div class="ambient-glow" aria-hidden="true"></div>
  {% block content %}{% endblock %}
  <script src="{% static 'frontend/result_cards.js' %}?v=20260920_cards_v4"></script>
  <script src="{% static 'frontend/app.js' %}?v=20260920_cards_v4"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
